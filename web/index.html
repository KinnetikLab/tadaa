<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1238FF">
<title>TADAA! · ¿Qué plan hay hoy?</title>
<meta name="description" content="Experiencias, conciertos, teatro y paseos con tarifas de convenio, Now! de último minuto y Golden Ticket.">
<link rel="icon" href="img/tv/logo-tadaa.png">
<link rel="preload" href="/fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/fonts/fonts.css?v=2">
<link rel="stylesheet" href="tv-motion.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#08091A;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;font-family:'Plus Jakarta Sans',system-ui,sans-serif;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{cursor:pointer}
button[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
#tv{transform-origin:0 0}
body[data-tv-mode="d"] #tv{min-height:100vh}
#tv>*{margin:0 auto}
body[data-tv-mode="m-desk"]{background:#1238FF url(img/tv/blue-wide.webp) center/cover fixed}
body[data-tv-mode="m-desk"] #tv{padding:20px 0}
body[data-tv-mode="m-desk"] #tv>*{border-radius:40px;box-shadow:0 40px 120px rgba(6,14,90,.6)}
[data-tv-scroll]{scrollbar-width:none;-webkit-overflow-scrolling:touch}
[data-tv-scroll]::-webkit-scrollbar{display:none}
@keyframes tv-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#tv-toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#FFFFFF;color:#08091A;padding:12px 20px;border-radius:99px;font:700 14px 'Plus Jakarta Sans',sans-serif;box-shadow:0 18px 40px rgba(8,9,26,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.34,1.56,.64,1);z-index:1000;max-width:92vw;text-align:center}
#tv-toast.on{opacity:1;transform:translate(-50%,0)}
#tv-toast.ok{background:#D6FF35}#tv-toast.err{background:#FF4D6D;color:#fff}
#tv-boot{position:fixed;inset:0;display:grid;place-items:center;background:#1238FF url(img/tv/blue-tall.webp) center/cover;z-index:2000;transition:opacity .4s}
#tv-boot img{width:150px;animation:tv-pop 1s ease-in-out infinite alternate}
@keyframes tv-pop{to{transform:scale(1.06)}}
body.tv-ready #tv-boot{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#tv-boot img{animation:none}}
</style>
<style id="tv-css"></style>
</head>
<body>
<div id="tv-boot" aria-hidden="true"><img src="img/tv/logo-tadaa.png" alt=""></div>
<main id="tv" aria-live="polite"></main>
<noscript><p style="color:#fff;padding:24px">TADAA! necesita JavaScript para mostrar la cartelera.</p></noscript>
<script src="api.js?v=7"></script>
<script src="tv-screens.js?v=7"></script>
<script src="tv-adapters.js?v=7"></script>
<script src="tv-app.js?v=7"></script>
<script src="tv-portals.js?v=7"></script>
<script src="tv-motion.js?v=8" defer></script>
</body>
</html>
