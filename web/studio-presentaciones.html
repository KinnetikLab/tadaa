<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presentaciones · Studio · TADAA!</title>
<link rel="preload" href="/fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--blue:#1238FF;--ink:#08091A;--lime:#D6FF35;--bg:#EEF1F7;--line:#D5DBEA;--mut:#5A6178;--out:cubic-bezier(0,0,.2,1);--spring:cubic-bezier(.2,1.2,.4,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
.ic{width:18px;height:18px;fill:currentColor;flex:0 0 auto}
.app{display:flex;min-height:100vh}
aside{flex:0 0 250px;background:var(--blue) url(img/tv/blue-tall.webp) center/cover;color:#fff;padding:26px 16px;display:flex;flex-direction:column;gap:4px;border-radius:0 32px 32px 0;position:sticky;top:0;height:100vh}
aside .lg{display:flex;align-items:center;gap:8px;padding:0 10px 22px}
aside .lg img{height:30px}
aside .lg span{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--lime)}
aside a{height:46px;padding:0 14px;border-radius:14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;text-decoration:none;transition:background .2s var(--out)}
aside a:hover{background:rgba(255,255,255,.12)}
aside a[aria-current=page]{background:#fff;color:var(--ink);font-weight:800}
aside .tip{margin-top:auto;background:rgba(8,9,26,.35);border-radius:18px;padding:14px;font-size:12px;line-height:1.5}
aside .tip b{display:block;color:var(--lime)}
main{flex:1;min-width:0;padding:30px 32px 60px;display:flex;flex-direction:column;gap:22px}
/* dentro de Studio: sin menú ni título propios */
body.embed aside,body.embed .top h1,body.embed .top small{display:none}body.embed{background:#fff}body.embed main{padding:22px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.top small{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--blue)}
h1{margin:6px 0 0;font:800 46px/1 Outfit,sans-serif;letter-spacing:-2px}
h2{margin:0;font:800 22px/1.1 Outfit,sans-serif}
.btn{height:46px;padding:0 18px;border-radius:99px;border:0;display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:scale .12s ease-out,background .2s var(--out)}
.btn:active{scale:.96}
.btn.dk{background:var(--ink);color:#fff}.btn.dk .ic{color:var(--lime)}
.btn.lm{background:var(--lime);color:var(--ink)}
.btn.wh{background:#fff;border:1px solid var(--line)}
.btn.sm{height:36px;padding:0 12px;font-size:12px}
.btn.ico{width:36px;padding:0;justify-content:center}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;gap:4px;background:#fff;border-radius:99px;padding:5px}
.seg button{height:40px;padding:0 18px;border:0;border-radius:99px;background:transparent;font-weight:800;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .2s var(--out),color .2s var(--out)}
.seg button[aria-selected=true]{background:var(--blue);color:#fff}
.seg b{font-size:11px;background:rgba(8,9,26,.08);border-radius:99px;padding:1px 7px}
.seg button[aria-selected=true] b{background:rgba(255,255,255,.2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:#fff;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;color:var(--mut)}
.kpi b{font:800 34px/1 Outfit,sans-serif}
.kpi.dk{background:var(--ink);color:#fff}.kpi.dk span{color:#AEB6D6}.kpi.dk b{color:var(--lime)}
.card{background:#fff;border-radius:28px;padding:22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff}
.search input{border:0;outline:0;width:220px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-size:11px;letter-spacing:.06em;font-weight:800;padding:10px 8px;white-space:nowrap}
td{padding:12px 8px;border-top:1px solid var(--bg);vertical-align:middle}
tr.new td{animation:hl 1.6s var(--out)}
@keyframes hl{from{background:#F2FFC2}}
.who{display:flex;align-items:center;gap:12px}
.who img,.who .mono{width:44px;height:44px;border-radius:12px;object-fit:cover;background:var(--bg)}
.who .mono{display:grid;place-items:center;font:800 15px Outfit,sans-serif;color:var(--blue)}
.who small{display:block;color:var(--mut);font-size:12px}
.pill{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:99px;font-size:11px;font-weight:800;border:0;cursor:pointer}
.st-draft{background:#EEF1F7;color:#4A5068}.st-sent{background:#DCE4FF;color:var(--blue)}.st-won{background:var(--lime);color:var(--ink)}.st-lost{background:#FFE1E1;color:#A3122A}.st-archived{background:#F4F4F6;color:#8C93B5}.st-published{background:var(--lime);color:var(--ink)}
select.pill{appearance:none;-webkit-appearance:none;padding-right:12px}
.acts{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:40px 10px;text-align:center;color:var(--mut)}
.empty b{display:block;font:800 22px Outfit,sans-serif;color:var(--ink);margin-bottom:6px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.lc{background:#fff;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s var(--spring),box-shadow .2s var(--out)}
.lc:hover{transform:translateY(-3px);box-shadow:0 20px 40px rgba(8,9,26,.08)}
.lc .ph{height:160px;display:grid;place-items:center;overflow:hidden}
.lc .ph img{max-width:100%;max-height:100%;object-fit:cover;width:100%;height:100%}
.lc .ph img.ct{object-fit:contain;padding:12px}
.lc .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.lc .bd b{font:800 20px/1.1 Outfit,sans-serif}
.lc .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mut)}
.lc .acts{justify-content:flex-start;margin-top:auto;flex-wrap:wrap}
.sw{display:flex;gap:4px}.sw i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
/* panel lateral */
.scrim{position:fixed;inset:0;background:rgba(8,9,26,0);pointer-events:none;transition:background .25s var(--out);z-index:40}
.scrim.open{background:rgba(8,9,26,.45);pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1100px,100vw);background:var(--bg);z-index:41;transform:translateX(102%);transition:transform .38s var(--spring);display:flex;box-shadow:-30px 0 60px rgba(8,9,26,.2)}
.drawer.open{transform:none}
.drawer form{flex:0 0 440px;max-width:100%;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px;background:#fff}
.drawer .pv{flex:1;min-width:0;display:flex;flex-direction:column;padding:18px;gap:10px}
.drawer .pv .bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.drawer .pv iframe{flex:1;border:0;border-radius:18px;background:#fff;box-shadow:0 20px 50px rgba(8,9,26,.15)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#4A5068}
label.f input,label.f select,label.f textarea{height:46px;border:1px solid var(--line);border-radius:14px;padding:0 14px;font-size:14px;color:var(--ink);background:#fff}
label.f textarea{height:auto;min-height:90px;padding:12px 14px;line-height:1.5;resize:vertical}
label.f textarea.code{font:12px/1.5 ui-monospace,Menlo,monospace;min-height:260px}
label.f small{font-weight:500;color:var(--mut)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}label.f input{min-width:0}
.err{background:#FFE1E1;color:#A3122A;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}
details{border:1px solid var(--line);border-radius:16px;padding:12px 14px}
details summary{cursor:pointer;font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
.leads{display:flex;flex-direction:column;gap:8px}
.leads div{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:60;transition:transform .35s var(--spring),opacity .2s var(--out)}
.toast.show{transform:translate(-50%,0);opacity:1}
.gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--blue) url(img/tv/blue-wide.webp) center/cover;z-index:70;padding:20px}
.gate form{background:#fff;border-radius:28px;padding:28px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){aside{display:none}main{padding:20px 16px}.drawer{flex-direction:column}.drawer form{flex:1 1 auto}.drawer .pv{display:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>

 <label class="f">Logo del prospecto<input name="logo_url" value="${esc(d.logo_url||'')}" placeholder="https://… o img/…"><small>Opcional. Se muestra junto a “Preparado para”.</small></label>
 <label class="f">Estado<select name="status">${Object.entries(DST).map(([k,v])=>`<option value="${k}"${k===d.status?' selected':''}>${v}</option>`).join('')}</select></label>
 ${!isNew&&d.leads?`<details open><summary>${ic('users')} Prospectos que dejaron datos (${d.leads})</summary><div class="leads" id="leadList" style="margin-top:10px">Cargando…</div></details>`:''}
 <p class="err" hidden></p><div style="display:flex;gap:10px;margin-top:auto;padding-top:6px"><button type="submit" class="btn dk" style="flex:1;justify-content:center">${ic('check')} ${isNew?'Crear presentación':'Guardar cambios'}</button>${isNew?'':`<button type="button" class="btn wh" data-copy="/p/${esc(d.slug)}">${ic('link')} Copiar</button>`}</div></form>`,
 async f=>{const v=Object.fromEntries(new FormData(f));v.config={...(d.config||{}),variant:v.variant};delete v.variant;if(!v.prospect.trim())throw new Error('Escribe el nombre del prospecto.');
  if(v.contact_email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.contact_email))throw new Error('Revisa el correo del contacto.');
  if(isNew){v.slug=slugify(v.slug||v.prospect);if(v.slug.length<2)throw new Error('El enlace corto necesita al menos 2 letras.');await api('pitches','POST',v);fresh=v.slug;toast('Presentación creada')}
  else{delete v.slug;await api('pitches/'+d.id,'PATCH',v);toast('Cambios guardados')}},pvFor(d.slug));
 const f=$('#drawer form');
 if(isNew){const p=f.prospect,s=f.slug;let touched=false;s.addEventListener('input',()=>{touched=true;s.value=slugify(s.value);$('.sl',f).textContent=s.value||'…'});p.addEventListener('input',()=>{if(!touched){s.value=slugify(p.value);$('.sl',f).textContent=s.value||'…'}})}
 if(!isNew&&d.leads)api('pitches/'+d.id+'/leads').then(r=>{$('#leadList').innerHTML=(r.leads||[]).map(x=>`<div><b>${esc(x.name)}</b>${x.organization?' · '+esc(x.organization):''}<br><a href="mailto:${esc(x.email)}">${esc(x.email)}</a> · <span style="color:var(--mut)">${ago(x.created_at)}</span></div>`).join('')||'Sin registros.'}).catch(e=>{$('#leadList').textContent=e.message});
}

const QUICK=[['hero.kicker','Frase sobre el título'],['hero.sub','Descripción de portada','area'],['hero.countdown','Fecha del estreno (ISO, ej. 2027-05-12T20:00:00-06:00)'],['card.when','Fechas cortas (tarjeta)'],['card.venue','Recinto (tarjeta)'],['tickets.title','Título de boletos'],['tickets.venue','Recinto completo'],['tickets.eventSlug','Evento en TADAA! (slug, para comprar de verdad)'],['cta.title','Frase final'],['cta.text','Texto final','area']];
const getP=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o),setP=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{if(typeof a[k]!=='object'||!a[k])a[k]={};a=a[k]});a[ks.at(-1)]=v};
function landForm(l){const c=JSON.parse(JSON.stringify(l.config||{}));
 openDrawer(`<form novalidate><div class="dh"><h2 id="dTitle" style="font-size:28px">${esc(l.title)}</h2><button type="button" class="btn wh ico" data-close aria-label="Cerrar">${ic('x')}</button></div>
 <div class="grid2"><label class="f">Nombre de la obra<input name="title" required value="${esc(l.title)}"></label><label class="f">Estado<select name="status">${Object.entries(LST).map(([k,v])=>`<option value="${k}"${k===l.status?' selected':''}>${v}</option>`).join('')}</select></label></div>
 ${QUICK.map(([p,lab,t])=>{const v=getP(c,p)??'';return t==='area'?`<label class="f">${lab}<textarea data-p="${p}">${esc(v)}</textarea></label>`:`<label class="f">${lab}<input data-p="${p}" value="${esc(v)}"></label>`}).join('')}
 <details><summary>${ic('code')} Configuración completa (JSON)</summary><p style="font-size:12px;color:var(--mut);margin:8px 0">Tema, colores, tipografías, secciones, canciones, personajes, zonas y precios. Los campos de arriba se aplican encima de este JSON al guardar.</p><label class="f"><span class="sr" style="position:absolute;left:-9999px">JSON</span><textarea class="code" name="json" spellcheck="false">${esc(JSON.stringify(c,null,2))}</textarea></label></details>
 <p class="err" hidden></p><button type="submit" class="btn dk" style="justify-content:center">${ic('check')} Guardar landing</button></form>`,
 async f=>{let cfg;try{cfg=JSON.parse(f.json.value)}catch(x){throw new Error('El JSON tiene un error de formato: '+x.message.replace(/^JSON\.parse: /,''))}
  if(!cfg||typeof cfg!=='object'||Array.isArray(cfg))throw new Error('La configuración debe ser un objeto JSON.');
  $$('[data-p]',f).forEach(i=>{const v=i.value.trim();if(v||getP(cfg,i.dataset.p)!=null)setP(cfg,i.dataset.p,v)});
  if(cfg.hero&&cfg.hero.countdown&&isNaN(Date.parse(cfg.hero.countdown)))throw new Error('La fecha del estreno no es válida. Usa el formato 2027-05-12T20:00:00-06:00.');
  await api('landings/'+l.id,'PATCH',{title:f.title.value.trim(),status:f.status.value,config:cfg});toast('Landing guardada');
  const fr=$('#drawer iframe');fr&&(fr.src=fr.src)},'landings/?s='+encodeURIComponent(l.slug));
}
function dupForm(from){const l=lands.find(x=>x.slug===from);
 openDrawer(`<form novalidate style="flex:1 1 auto;max-width:520px"><div class="dh"><h2 id="dTitle" style="font-size:28px">Duplicar landing</h2><button type="button" class="btn wh ico" data-close aria-label="Cerrar">${ic('x')}</button></div>
 <p style="margin:0;color:var(--mut)">Se copia todo de <b>${esc(l?l.title:from)}</b>: tema, secciones e interacción. Luego cambias textos, imágenes y fechas.</p>
 <label class="f">Nombre de la nueva obra<input name="title" required placeholder="Ej. Hairspray — El Musical"></label>
 <label class="f">Enlace<input name="slug" placeholder="hairspray"><small>${ORIGIN}/obra/<b class="sl">…</b></small></label>
 <p class="err" hidden></p><button type="submit" class="btn dk" style="justify-content:center">${ic('files')} Crear copia como borrador</button></form>`,
 async f=>{const title=f.title.value.trim(),slug=slugify(f.slug.value||title);if(!title)throw new Error('Escribe el nombre de la obra.');if(slug.length<2)throw new Error('El enlace necesita al menos 2 letras.');
  await api('landings','POST',{title,slug,copyFrom:from});fresh=slug;toast('Copia creada como borrador')});
 const f=$('#drawer form');let t=false;f.slug.addEventListener('input',()=>{t=true;f.slug.value=slugify(f.slug.value);$('.sl',f).textContent=f.slug.value||'…'});f.title.addEventListener('input',()=>{if(!t){f.slug.value=slugify(f.title.value);$('.sl',f).textContent=f.slug.value||'…'}});
}

/* ---- eventos ---- */
document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;
 if(b.dataset.grp){grp=b.dataset.grp;paint();return}
 if(b.dataset.tab){tab=b.dataset.tab;$$('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));paint();return}
 if(b.dataset.copy){try{await navigator.clipboard.writeText(ORIGIN+b.dataset.copy);toast('Enlace copiado: '+ORIGIN+b.dataset.copy)}catch{prompt('Copia el enlace',ORIGIN+b.dataset.copy)}return}
 if(b.dataset.edit){deckForm(decks.find(d=>d.id===b.dataset.edit));return}
 if(b.dataset.leads){deckForm(decks.find(d=>d.id===b.dataset.leads));return}
 if(b.dataset.ledit){landForm(lands.find(l=>l.id===b.dataset.ledit));return}
 if(b.dataset.dup){dupForm(b.dataset.dup);return}
 if(b.id==='newBtn'){tab==='decks'?deckForm(null):dupForm((lands[0]||{}).slug||'kinky-boots')}});
document.addEventListener('change',async e=>{const s=e.target.closest('[data-st]');if(!s)return;const d=decks.find(x=>x.id===s.dataset.st),prev=d.status;d.status=s.value;s.className='pill st-'+s.value;
 try{await api('pitches/'+d.id,'PATCH',{status:s.value});toast('Estado: '+DST[s.value])}catch(x){d.status=prev;s.value=prev;s.className='pill st-'+prev;toast(x.message)}});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();paint()});
$('#today').textContent=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();
(async()=>{if(await me())load();else gate()})();
})();
</script>
</body>
</html>
