<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evento · TADAA!</title>
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="curtain.css">
<style>
:root{--lime:#d6ff35;--bg:#050505;--card:#101010;--line:rgba(255,255,255,.12);--mut:#aaa;--font:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f7f7;font-family:var(--font);line-height:1.55}
a{color:inherit;text-decoration:none}.wrap{max-width:1160px;margin:auto;padding:26px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:16px 0}
.logo{font-size:30px;font-weight:800;letter-spacing:-.06em}.logo b{color:var(--lime)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:14px;background:var(--lime);color:#050505;font-weight:800}
.btn.ghost{background:#171717;color:#fff;border:1px solid var(--line)}
.hero{margin-top:30px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:34px;align-items:center}
.hero img{width:100%;display:block;border-radius:26px;border:1px solid var(--line);box-shadow:0 28px 80px #000}
.kicker{color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(38px,5.4vw,66px);line-height:.98;letter-spacing:-.055em;margin:12px 0}
.muted{color:var(--mut)}.meta{display:grid;gap:12px;margin:24px 0}.meta div{padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.meta small{display:block;color:var(--mut);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.meta b{display:block;margin-top:3px}
.notice{margin-top:28px;padding:18px 20px;border:1px solid rgba(214,255,53,.28);border-radius:18px;background:rgba(214,255,53,.055);color:#ddd;font-size:13px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
footer{margin:60px 0 20px;padding-top:22px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}
@media(max-width:760px){.wrap{padding:18px}.hero{grid-template-columns:1fr}.hero img{max-height:480px;object-fit:cover}.hero>div:first-child{order:2}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="index.html">tadaa<b>!</b></a><a class="btn ghost" href="index.html#hoy">← Volver a cartelera</a></header>
<main id="event" aria-live="polite"><p class="muted">Cargando ficha del evento…</p></main>
<footer>© 2026 TADAA! · Información editorial consultada el 19 de noviembre de 2026. Confirma siempre horarios, precios y disponibilidad con el recinto o la boletera oficial.</footer>
</div>
<script src="api.js"></script><script src="event-live.js"></script>
</body></html>
