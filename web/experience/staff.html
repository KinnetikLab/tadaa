<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08091A">
<title>TADAA! Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tv.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--tv-ink);color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{padding:calc(14px + env(safe-area-inset-top)) 18px 14px;background:var(--tv-blue) url(img/tv/blue-wide.webp) center/cover;border-radius:0 0 28px 28px}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--tv-display);font-weight:800;font-size:28px;letter-spacing:-.05em;color:#fff;text-decoration:none}.logo b{color:var(--tv-lime)}
.staff-pill{background:var(--tv-lime);color:var(--tv-ink);font-weight:800;font-size:11px;letter-spacing:.14em;padding:6px 10px;border-radius:999px}
select{width:100%;margin-top:14px;background:rgba(8,9,26,.35);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:14px;padding:12px 14px;font:inherit;font-weight:700}
select option{color:#08091A}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;background:rgba(8,9,26,.35);padding:4px;border-radius:999px}
.mode button{border:0;border-radius:999px;padding:10px;font:inherit;font-weight:800;background:transparent;color:#fff;cursor:pointer}
.mode button.on{background:#fff;color:var(--tv-ink)}
main{flex:1;padding:18px}
.cam{position:relative;aspect-ratio:1;border-radius:28px;overflow:hidden;background:#000;border:2px solid rgba(255,255,255,.12)}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:16%;border:3px solid var(--tv-lime);border-radius:24px;box-shadow:0 0 0 999px rgba(8,9,26,.45)}
.cam .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-weight:700;font-size:13px}
.cam .off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#AEB6D6}
.manual{margin-top:14px;display:flex;gap:8px}
input,textarea{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:12px 14px;font:inherit}
.btn{border:0;border-radius:999px;padding:12px 18px;font:inherit;font-weight:800;background:var(--tv-lime);color:var(--tv-ink);cursor:pointer}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn.sm{padding:8px 12px;font-size:13px}
.result{margin-top:16px;border-radius:24px;padding:18px;display:none}
.result.show{display:block;animation:pop .25s ease}
.result.ok{background:var(--tv-lime);color:var(--tv-ink)}.result.bad{background:#FF4D6D;color:#fff}.result.gold{background:linear-gradient(120deg,#FFE9A8,#E9B949);color:#2A1A00}
.result h2{font-family:var(--tv-display);font-size:32px;margin:0 0 4px;letter-spacing:-.02em}
.result p{margin:2px 0}.result .addon-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.15)}
.card{background:#161833;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:16px;margin-top:12px}
.card h3{margin:0;font-family:var(--tv-display);font-size:20px}.card small{color:#AEB6D6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:11px;font-weight:800;letter-spacing:.06em;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.1)}
.chip.prov{background:#FFB547;color:#2a1a00}.chip.deliv{background:#7AA2FF;color:#08091A}.chip.final{background:var(--tv-lime);color:#08091A}.chip.used{background:#3a3d63}.chip.gold{background:#E9B949;color:#2A1A00}.chip.now{background:var(--tv-now);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.counter{display:flex;align-items:center;gap:8px}.counter button{width:34px;height:34px;border-radius:50%;border:0;background:#fff;font-weight:800;font-size:18px}
.empty{color:#AEB6D6;text-align:center;padding:40px 10px}
.log{margin-top:18px}.log div{display:flex;justify-content:space-between;font-size:13px;color:#AEB6D6;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.log b.ok{color:var(--tv-lime)}.log b.bad{color:#FF4D6D}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:var(--tv-ink);padding:10px 16px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
@keyframes pop{from{transform:scale(.96);opacity:0}}
</style>
</head>
<body>
<div class="app">
 <header>
  <div class="top"><a class="logo" href="app.html">tadaa<b>!</b></a><span class="staff-pill">STAFF</span></div>
  <select id="event" aria-label="Evento"></select>
  <div class="mode" role="tablist"><button class="on" data-mode="scan" role="tab">Escanear QR</button><button data-mode="verify" role="tab">Verificar compra</button></div>
 </header>
 <main>
  <section id="scan">
   <div class="cam"><video id="video" playsinline muted></video><div class="frame"></div><div class="hint" id="camHint">Apunta al QR dinámico del boleto final</div><div class="off" id="camOff" hidden></div></div>
   <div class="manual"><input id="qrManual" placeholder="Pega el código si la cámara no está disponible"><button class="btn" id="qrGo">Validar</button></div>
   <div class="result" id="scanResult" aria-live="assertive"></div>
   <div class="log" id="log"></div>
  </section>
  <section id="verify" hidden>
   <p style="color:#AEB6D6;margin-top:0">Para boletera externa o pases provisionales: busca por folio <b>TD-…</b>, nombre, correo o folio de la boletera. Marca el acceso y entrega los add-ons.</p>
   <div class="manual"><input id="q" placeholder="TD-40EF25AB, Ana, ana@correo.com" autocomplete="off"><button class="btn" id="qGo">Buscar</button></div>
   <div id="orders"></div>
  </section>
 </main>
</div>
<div id="toast" role="status"></div>
<script src="api.js"></script>
<script src="staff-live.js"></script>
</body>
</html>
