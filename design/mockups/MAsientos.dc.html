<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tadaa! móvil · Elegir asientos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.tx{background:#1238FF url(/_blob/c238803f93edbcfca0600e4470e86b80) center top/cover}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF1F7; font-family: 'Plus Jakarta Sans', sans-serif; color: #08091A">

  <header class="tx" style="color: #FFFFFF; padding: 54px 20px 20px; border-radius: 0 0 32px 32px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="MEvento.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; flex: 0 0 44px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <span style="display: flex; flex-direction: column; flex: 1">
        <b style="font-family: Outfit, sans-serif; font-size: 20px">{{evTitle}}</b>
        <span style="font-size: 12px; color: #D9E0FF">{{evSub}}</span>
      </span>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <span style="background: #D6FF35; color: #08091A; font-size: 10px; font-weight: 800; letter-spacing: .05em; padding: 5px 9px; border-radius: 99px">TADAA! TICKETS · BOLETO FINAL</span>
      <sc-if value="{{promo}}"><span style="background: rgba(255,255,255,.16); font-size: 10px; font-weight: 800; letter-spacing: .05em; padding: 5px 9px; border-radius: 99px">{{promo}}</span></sc-if>
    </div>
  </header>

  <div style="margin: 16px 16px 0; background: #FFFFFF; border-radius: 28px; padding: 16px 12px 14px">
    <div style="margin: 0 auto 14px; width: 240px; height: 30px; border-radius: 0 0 120px 120px / 0 0 30px 30px; background: #08091A; color: #D6FF35; display: grid; place-items: center; font-size: 11px; font-weight: 800; letter-spacing: .3em">ESCENARIO</div>
    <div style="display: flex; flex-direction: column; gap: 5px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 4px">
          <span style="width: 14px; font-size: 10px; font-weight: 800; color: #8C93B5">{{r.label}}</span>
          <div style="flex: 1; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px">
            <sc-for list="{{r.seats}}" as="s" hint-placeholder-count="14">
              <button onClick="{{s.pick}}" aria-label="{{s.aria}}" aria-pressed="{{s.on}}" disabled="{{s.taken}}" style="{{s.style}}"></button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; font-size: 11px; color: #4A5068">
      <sc-for list="{{legend}}" as="lg"><span style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 12px; border-radius: 3px; background: {{lg.color}}"></span>{{lg.label}}</span></sc-for>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 12px; border-radius: 4px; background: #D6FF35; box-shadow: inset 0 0 0 2px #08091A"></span>Tuyos</span>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px; background: #08091A; color: #FFFFFF; border-radius: 28px; padding: 16px">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
      <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 11px; color: #AEB6D6">{{count}} asiento(s) · apartados 10:00 min</span>
        <b style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{picked}}</b>
      </span>
      <b style="font-family: Outfit, sans-serif; font-size: 26px">{{total}}</b>
    </div>
    <button onClick="{{pay}}" style="margin-top: 12px; height: 56px; border-radius: 99px; background: #D6FF35; color: #08091A; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 15px">{{payLabel}}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#08091A" stroke-width="2.6" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { sel: ['G-8', 'G-9'] }; }
  renderVals() {
    const letters = ['A','B','C','D','E','F','G','H'];
    const zone = r => r < 3 ? { c: '#1238FF', p: 1400, n: 'Orquesta' } : r < 6 ? { c: '#7FA0FF', p: 1200, n: 'Platea' } : { c: '#B9C7FF', p: 700, n: 'Mezzanine' };
    const takenSet = new Set(['A-3','A-4','A-5','A-10','B-6','B-7','B-8','B-9','C-2','C-12','D-5','D-6','E-1','E-13','F-7','F-8','F-9','G-4','G-11','H-6','H-7']);
    const sel = this.state.sel;
    const rows = letters.map((L, r) => {
      const z = zone(r);
      return { label: L, seats: Array.from({ length: 14 }, (_, i) => {
        const id = L + '-' + (i + 1), taken = takenSet.has(id), on = sel.includes(id);
        const aisle = i === 6 ? ' margin-right: 6px;' : '';
        return { taken, on, aria: 'Fila ' + L + ' asiento ' + (i + 1) + ' · ' + z.n + (taken ? ' · ocupado' : ''),
          pick: () => { if (taken) return; this.setState({ sel: on ? sel.filter(x => x !== id) : sel.length >= 8 ? sel : [...sel, id] }); },
          style: 'aspect-ratio: 1; min-width: 0; padding: 0; border: 0; border-radius: 6px 6px 4px 4px;' + aisle + ' ' +
            (on ? 'background: #D6FF35; box-shadow: inset 0 0 0 2px #08091A;' : taken ? 'background: #E1E6F2;' : 'background: ' + z.c + ';') };
      }) };
    });
    const price = id => zone(letters.indexOf(id.split('-')[0])).p;
    const total = sel.reduce((a, id) => a + price(id), 0);
    return { rows, count: sel.length, picked: sel.length ? sel.map(id => 'Fila ' + id.replace('-', ' · ')).join(', ') : 'Toca un asiento',
      total: '$' + total.toLocaleString('en-US') };
  }
}
</script>
</body>
</html>
