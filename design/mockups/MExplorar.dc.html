<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tadaa! móvil · Explorar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EEF1F7; font-family: 'Plus Jakarta Sans', sans-serif; color: #08091A">

  <header style="padding: 58px 20px 14px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: Outfit, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -1px">Cartelera</h1>
      <button style="display: flex; align-items: center; gap: 6px; border: 1px solid #D5DBEA; background: #FFFFFF; border-radius: 99px; padding: 10px 14px; font: inherit; font-size: 12px; font-weight: 700; color: #08091A">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1238FF" stroke-width="2.2" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
        CDMX
      </button>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 99px; padding: 6px 6px 6px 18px; box-shadow: 0 8px 24px rgba(18,56,255,.08)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6178" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input placeholder="Busca evento, película o museo" aria-label="Buscar" value="{{q}}" onInput="{{search}}" style="flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; font-size: 13px; background: transparent">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #1238FF; display: grid; place-items: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      </span>
    </label>
    <div role="tablist" aria-label="Tipo de plan" style="display: flex; gap: 4px; background: #FFFFFF; border-radius: 99px; padding: 4px">
      <sc-for list="{{modes}}" as="mo"><button role="tab" aria-selected="{{mo.on}}" onClick="{{mo.pick}}" style="{{mo.style}}"><svg width="15" height="15" viewBox="0 0 256 256" aria-hidden="true"><path d="{{mo.icon}}" fill="currentColor"/></svg>{{mo.label}}</button></sc-for>
    </div>
    <div style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none">
      <sc-for list="{{cats}}" as="c"><button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button></sc-for>
    </div>
  </header>

  <div style="display: flex; gap: 12px; padding: 4px 20px 0 12px">
    <sc-if value="{{withDates}}"><div role="group" aria-label="Elegir día" style="flex: 0 0 52px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <span style="font-size: 11px; font-weight: 800; color: #5A6178; letter-spacing: .1em; padding: 4px 0">{{month}}</span>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <button onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="{{d.style}}">
          <span style="font-family: Outfit, sans-serif; font-weight: 700; font-size: 18px; line-height: 1">{{d.n}}</span>
          <span style="font-size: 10px; font-weight: 600">{{d.w}}</span>
        </button>
      </sc-for>
    </div></sc-if>

    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{groups}}" as="g"><sc-if value="{{g.label}}"><div style="display: flex; align-items: baseline; gap: 8px; padding: 6px 4px 0"><b style="font-family: Outfit, sans-serif; font-size: 20px">{{g.label}}</b><span style="font-size: 12px; color: #5A6178">{{g.sub}}</span></div></sc-if>
      <sc-for list="{{g.items}}" as="e">
      <a href="MEvento.dc.html" style="position: relative; height: 252px; border-radius: 28px; overflow: hidden; color: #FFFFFF; display: block; background: #08091A">
        <sc-if value="{{e.video}}"><video src="{{e.video}}" poster="{{e.img}}" autoplay muted loop playsinline aria-label="Video promocional" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></video></sc-if>
        <sc-if value="{{e.photo}}"><img src="{{e.img}}" alt="{{e.title}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{e.pos}}; opacity: .9"></sc-if>
        <span style="position: absolute; left: 14px; top: 14px; background: #D6FF35; color: #08091A; border-radius: 99px; padding: 7px 11px; font-size: 11px; font-weight: 800">{{e.price}}</span>
        <sc-if value="{{e.kindLabel}}"><span style="position: absolute; right: 14px; top: 14px; background: rgba(8,9,26,.6); color: #FFFFFF; border-radius: 99px; padding: 7px 10px; font-size: 10px; font-weight: 800">{{e.kindLabel}}</span></sc-if>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 50px 16px 16px; background: linear-gradient(transparent, rgba(8,9,26,.9))">
          <div style="display: flex; gap: 6px; margin-bottom: 8px"><sc-if value="{{e.original}}"><span title="TADAA! Original" role="img" aria-label="TADAA! Original" style="width: 28px; height: 28px; border-radius: 50%; background: #D6FF35; color: #08091A; display: grid; place-items: center; font: 800 11px Outfit, sans-serif">t!</span></sc-if><sc-if value="{{e.rush}}"><span title="Now! disponible" role="img" aria-label="Now! disponible" style="width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #FF3D8B, #FF8A3D); display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#0B0A1C" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></span></sc-if><sc-if value="{{e.golden}}"><span title="Golden Ticket activo" role="img" aria-label="Golden Ticket activo" style="width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #FFE9A3, #E2B23C 55%, #B8860B); display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2A1A00" stroke-width="2.2" aria-hidden="true"><path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4z"/></svg></span></sc-if></div>
          <div style="font-family: Outfit, sans-serif; font-weight: 800; font-size: 26px; line-height: 1">{{e.title}}</div>
          <div style="display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 12px; color: #D9E0FF">
            <span>{{e.venue}}</span><span style="font-weight: 700; color: #FFFFFF; white-space: nowrap">{{e.whenLine}}</span>
          </div>
        </div>
      </a>
      </sc-for></sc-for>
      <sc-if value="{{empty}}"><div style="background: #FFFFFF; border-radius: 28px; padding: 28px 20px; text-align: center; color: #4A5068; font-size: 14px"><b style="display: block; font-family: Outfit, sans-serif; font-size: 20px; color: #08091A; margin-bottom: 6px">{{emptyTitle}}</b>{{emptyMsg}}</div></sc-if>
      <div style="height: 120px"></div>
    </div>
  </div>
  <nav aria-label="Navegación principal" style="position: absolute; left: 20px; right: 20px; bottom: 26px; height: 68px; border-radius: 99px; background: rgba(8,9,26,.92); backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: space-between; padding: 0 10px; box-shadow: 0 18px 40px rgba(8,9,26,.3)">
    <a href="Main.dc.html" aria-label="Inicio" style="width: 50px; height: 50px; border-radius: 50%; color: #FFFFFF; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg></a>
    <a href="MExplorar.dc.html" aria-label="Explorar" style="height: 50px; padding: 0 18px; border-radius: 99px; background: #D6FF35; color: #08091A; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Explorar</a>
    <a href="MWallet.dc.html" aria-label="Wallet" style="width: 50px; height: 50px; border-radius: 50%; color: #FFFFFF; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4z"/></svg></a>
    <a href="MRush.dc.html" aria-label="Now!" style="width: 50px; height: 50px; border-radius: 50%; color: #FFFFFF; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></a>
    <a href="MCuenta.dc.html" aria-label="Cuenta" style="width: 50px; height: 50px; border-radius: 50%; color: #FFFFFF; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { picked: 17 }; }
  renderVals() {
    const base = 'width: 48px; height: 60px; border-radius: 99px; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; ';
    const ws = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
    const days = [17,18,19,20,21,22,23].map((n,i) => {
      const on = this.state.picked === n;
      return { n, w: ws[i], on, pick: () => this.setState({ picked: n }),
        style: base + (on ? 'background: #08091A; color: #D6FF35;' : 'background: transparent; color: #08091A;') };
    });
    return { days };
  }
}
</script>
</body>
</html>
