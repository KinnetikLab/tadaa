<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tadaa! móvil · Pase y boleto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.tx{background:#1238FF url(/_blob/c238803f93edbcfca0600e4470e86b80) center/cover}
</style>
</helmet>
<div class="tx" style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; color: #FFFFFF">

  <header style="padding: 56px 20px 0; display: flex; align-items: center; justify-content: space-between">
    <a href="MWallet.dc.html" aria-label="Volver a Mi Wallet" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <span style="font-family: Outfit, sans-serif; font-weight: 700; font-size: 18px">Tu boleto</span>
    <button aria-label="Compartir" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); display: grid; place-items: center">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
    </button>
  </header>

  <div role="tablist" aria-label="Vista de demostración: estado del boleto" style="margin: 12px 20px 0; display: flex; gap: 4px; background: rgba(8,9,26,.3); border-radius: 99px; padding: 4px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <article style="{{cardStyle}}">
    <div style="display: flex; gap: 12px; align-items: center">
      <img src="{{img}}" alt="" style="width: 76px; height: 76px; border-radius: 18px; object-fit: cover">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
        <span style="{{chipStyle}}">{{chip}}</span>
        <span style="font-family: Outfit, sans-serif; font-weight: 800; font-size: 22px; line-height: 1.05">{{title}}</span>
      </div>
    </div>

    <div style="position: relative; margin: 16px -12px 0; border-top: 2px dashed #9DAEF5">
      <span style="position: absolute; left: -12px; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: #1A3BF0"></span>
      <span style="position: absolute; right: -12px; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: #1A3BF0"></span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 14px 4px 0">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #5A6178">Fecha</span><b style="font-size: 13px">{{day}}</b></span>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #5A6178">Hora</span><b style="font-size: 13px">{{hour}}</b></span>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: #5A6178">Lugar</span><b style="font-size: 13px">{{seat}}</b></span>
    </div>

    <div style="position: relative; margin: 16px -12px 0; border-top: 2px dashed #9DAEF5">
      <span style="position: absolute; left: -12px; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: #1838EA"></span>
      <span style="position: absolute; right: -12px; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: #1838EA"></span>
    </div>

    <sc-if value="{{isFinal}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 16px">
        <div role="img" aria-label="Código QR dinámico de acceso" style="width: 196px; height: 196px; padding: 10px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 0 0 2px #E1E6F2; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr))">
          <img src="{{qrSrc}}" alt="" style="grid-column: 1 / -1; grid-row: 1 / -1; width: 100%; height: 100%; display: block; image-rendering: pixelated">
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="{{ring}}"><span style="width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF"></span></span>
          <span style="font-size: 12px; color: #4A5068">Se renueva en <b style="color: #08091A">{{left}}</b> · capturas no sirven</span>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{notFinal}}" hint-placeholder-val="{{ false }}">
      <ol style="list-style: none; margin: 0; padding: 16px 4px 0; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
          <li style="display: flex; gap: 12px; align-items: flex-start">
            <span style="{{s.dot}}">{{s.mark}}</span>
            <span style="display: flex; flex-direction: column; gap: 2px">
              <b style="font-size: 13px; color: {{s.color}}">{{s.title}}</b>
              <span style="font-size: 12px; color: #5A6178">{{s.sub}}</span>
            </span>
          </li>
        </sc-for>
      </ol>
    </sc-if>
  </article>

  <p style="margin: 12px 28px 0; font-size: 11px; line-height: 1.5; color: #D9E0FF; text-align: center">{{note}}</p>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; gap: 10px; align-items: center">
    <button aria-label="Agregar a Apple Wallet o Google Wallet" style="width: 64px; height: 64px; border-radius: 50%; border: 0; background: #08091A; display: grid; place-items: center; flex: 0 0 64px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
    </button>
    <button onClick="{{ctaAction}}" style="flex: 1; height: 64px; border-radius: 99px; border: 0; background: rgba(255,255,255,.18); backdrop-filter: blur(10px); color: #FFFFFF; display: flex; align-items: center; gap: 14px; padding: 6px 22px 6px 6px; font: inherit; font-weight: 700; font-size: 15px">
      <span style="width: 52px; height: 52px; border-radius: 50%; background: #D6FF35; display: grid; place-items: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#08091A" stroke-width="2.2" aria-hidden="true"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4"/></svg>
      </span>
      <span style="flex: 1; text-align: left">{{cta}}</span>
      <span style="letter-spacing: -2px; color: #D9E0FF" aria-hidden="true">›››</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { view: 'final', now: Date.now() }; }
  componentDidMount(){ this.t = setInterval(() => this.setState({ now: Date.now() }), 1000); }
  componentWillUnmount(){ clearInterval(this.t); }
  qr(seed){
    let x = seed * 9301 + 49297;
    const rnd = () => { x = (x * 9301 + 49297) % 233280; return x / 233280; };
    const N = 25, cells = [];
    const finder = (r, c, r0, c0) => {
      const i = r - r0, j = c - c0;
      if (i < 0 || j < 0 || i > 6 || j > 6) return null;
      const edge = i === 0 || j === 0 || i === 6 || j === 6;
      const core = i >= 2 && i <= 4 && j >= 2 && j <= 4;
      return edge || core;
    };
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      let f = finder(r, c, 0, 0); if (f === null) f = finder(r, c, 0, 18); if (f === null) f = finder(r, c, 18, 0);
      const quiet = (r === 7 && (c < 8 || c > 16)) || (c === 7 && (r < 8 || r > 16)) || (r === 17 && c < 8) || (c === 17 && r < 8);
      const on = f !== null ? f : quiet ? false : rnd() > 0.52;
      cells.push({ s: 'aspect-ratio: 1; background: ' + (on ? '#08091A' : 'transparent') + ';' + (f !== null && on ? '' : ' border-radius: 1px;') });
    }
    return cells;
  }
  renderVals() {
    const v = this.state.view;
    const now = new Date(this.state.now);
    const sec = 60 - now.getSeconds();
    const minuteSeed = Math.floor(this.state.now / 60000) % 100000;
    const tabBase = 'flex: 1; height: 40px; border: 0; border-radius: 99px; font-family: inherit; font-weight: 800; font-size: 12px; ';
    const tabs = [['prov','Provisional'],['entrega','En entrega'],['final','Boleto final']].map(([id, label]) => ({
      label, on: v === id, pick: () => this.setState({ view: id }),
      style: tabBase + (v === id ? 'background: #FFFFFF; color: #08091A;' : 'background: transparent; color: #D9E0FF;') }));
    const cardBase = 'position: relative; margin: 14px 20px 0; color: #08091A; border-radius: 32px; padding: 14px 12px 18px; ';
    const cardStyle = cardBase + (v === 'prov' ? 'background: #F4F6FC; outline: 2px dashed rgba(255,255,255,.75); outline-offset: 5px;' : 'background: #FFFFFF;');
    const chipBase = 'align-self: flex-start; font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 5px 9px; border-radius: 99px; ';
    const chips = {
      prov: ['PASE PROVISIONAL · NO ES ACCESO', 'background: transparent; color: #4A5068; border: 1.5px dashed #8C93B5;'],
      entrega: ['EN ENTREGA · PROVEEDOR EXTERNO', 'background: #FFE9A8; color: #5A3D00;'],
      final: ['BOLETO FINAL · TADAA! TICKETS', 'background: #D6FF35; color: #08091A;']
    };
    const st = (i, cur) => {
      const done = i < cur, now2 = i === cur;
      return { mark: done ? '✓' : String(i + 1), color: done || now2 ? '#08091A' : '#8C93B5',
        dot: 'width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; ' +
          (done ? 'background: #08091A; color: #D6FF35;' : now2 ? 'background: #1238FF; color: #FFFFFF; box-shadow: 0 0 0 4px #D6DDFF;' : 'background: #EEF1F7; color: #8C93B5;') };
    };
    const cur = v === 'prov' ? 1 : 2;
    const raw = [
      ['Solicitud recibida', 'Folio TD-2611-0063'],
      [v === 'prov' ? 'Confirmando con el productor' : 'Pagado con Clip', v === 'prov' ? 'Te avisamos en menos de 8 h' : '$1,400 · 21 nov 13:02'],
      ['Entrega de boletos', 'El productor los envía a ana@correo.com o en taquilla'],
      ['Boleto final', 'Listo para entrar']
    ];
    const steps = raw.map(([title, sub], i) => ({ title, sub, ...st(i, cur) }));
    const notes = {
      prov: 'El pase provisional sirve para seguir tu solicitud. No da acceso al evento.',
      entrega: 'Este evento lo vende un proveedor externo; sus boletos oficiales son tu acceso.',
      final: 'QR firmado y de un solo uso. Cambia cada minuto para evitar copias.'
    };
    const ctas = { prov: 'Ver estado de mi solicitud', entrega: 'Cómo recibir mis boletos', final: 'Subir brillo para escanear' };
    const pct = Math.round((sec / 60) * 360);
    return {
      tabs, cardStyle, chip: chips[v][0], chipStyle: chipBase + chips[v][1],
      seat: v === 'final' ? 'Mezz. G · 8–9' : 'Mezzanine 1 × 2',
      isFinal: v === 'final', notFinal: v !== 'final', steps,
      cells: this.qr(minuteSeed), left: '0:' + String(sec).padStart(2, '0'),
      ring: 'width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#1238FF ' + pct + 'deg, #E1E6F2 0);',
      note: notes[v], cta: ctas[v]
    };
  }
}
</script>
</body>
</html>
